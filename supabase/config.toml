project_id = "tallynest"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = true
otp_length = 6
otp_expiry = 600
max_frequency = "1m"

[auth.email.template.magic_link]
subject = "Your TallyNest sign-in code"
content_path = "./templates/email_otp.html"
